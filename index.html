<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ares - PMP Game (Level 1)</title>
    <style>
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; color: white; }
        .game-window { width: 800px; height: 500px; background: #1a1a2e; border: 4px solid #4ecdc4; border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(78, 205, 196, 0.4); }
        .hud { display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.7); padding: 10px; border-bottom: 2px solid #4ecdc4; font-weight: bold; }
        .hud span { color: #ff6b6b; }
        .scene { display: flex; justify-content: center; align-items: flex-end; height: 230px; }
        .character { font-size: 80px; }
        .dialogue-box { position: absolute; bottom: 0; width: 100%; height: 210px; background: rgba(15, 15, 25, 0.95); border-top: 3px solid #fff; padding: 15px 20px; box-sizing: border-box; overflow-y: auto; }
        .speaker-name { font-weight: bold; color: #4ecdc4; font-size: 1.2rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .domain-badge { font-size: 0.9rem; background: #ff6b6b; color: #111; padding: 2px 8px; border-radius: 5px; }
        .message { font-size: 1.1rem; line-height: 1.4; margin-bottom: 15px; }
        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-btn { background: #222; color: white; border: 1px solid #4ecdc4; padding: 10px; text-align: left; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-size: 1rem; transition: 0.2s; }
        .option-btn:hover { background: #4ecdc4; color: black; }
        .next-btn { display: none; background: #ff6b6b; color: #111; border: none; padding: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Courier New', Courier, monospace; margin-top: 10px;}
        .next-btn:hover { background: #fff; }
    </style>
</head>
<body>

<div class="game-window">
    <div class="hud">
        <div>Score: <span id="hud-score">0</span></div>
        <div>Progress: <span id="hud-progress">1 / 7</span></div>
    </div>
    <div class="scene">
        <div class="character" id="char">👤</div>
    </div>
    <div class="dialogue-box">
        <div class="speaker-name">
            <span id="speaker">System</span> 
            <span class="domain-badge" id="domain">Loading</span>
        </div>
        <div class="message" id="message">Initializing Project Ares...</div>
        <div class="options-container" id="options"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Start >></button>
    </div>
</div>

<script>
    const database = [
        {
            domain: "Agile", topic: "Daily Standup", char: "🧑‍💻", speaker: "Lead Dev",
            scenario: `"I realized we could rewrite the rendering engine. Let me explain the technical architecture for the next 20 minutes..."`,
            correct: `Put the idea in the Parking Lot and discuss it offline after the standup.`,
            wrong1: `Let him speak for 20 minutes to ensure you understand.`,
            wrong2: `Yell at him and tell him to wait his turn.`,
            feedback: `Protect the 15-minute timebox! Servant Leaders move deep discussions offline.`
        },
        {
            domain: "Predictive", topic: "Scope Change", char: "👨‍💼", speaker: "Sponsor",
            scenario: `"I know the charter is signed, but I want to add a luxury swimming pool module to the launch. Make it happen."`,
            correct: `Evaluate the impact on time/cost and submit a Change Request to the CCB.`,
            wrong1: `Say 'No' because a signed charter cannot be changed.`,
            wrong2: `Agree immediately and add it to the project plan to keep him happy.`,
            feedback: `PMI Mindset: In predictive projects, new scope requires Perform Integrated Change Control.`
        },
        {
            domain: "Predictive", topic: "Risk Management", char: "👷", speaker: "Procurement",
            scenario: `"Bad news. The Earth-based supplier building our titanium habitat walls just filed for bankruptcy. They cannot deliver."`,
            correct: `Update the Risk Register and implement the planned risk response for supplier failure.`,
            wrong1: `Immediately use the Management Reserve to hire a new, more expensive supplier.`,
            wrong2: `Halt the project and call an emergency meeting with the Project Sponsor.`,
            feedback: `PMI Mindset: Don't panic, follow the plan! Update the Risk Register first and use pre-planned responses.`
        },
        {
            domain: "Agile", topic: "Tech Debt", char: "👩‍💻", speaker: "Scrum Team",
            scenario: `"Our velocity dropped. The old legacy code is too messy to work with. It's slowing us down."`,
            correct: `Encourage the team to add refactoring tasks to the backlog and discuss it at the Retrospective.`,
            wrong1: `Mandate that the team works overtime this weekend to clean up the code.`,
            wrong2: `Tell the team to ignore the messy code and focus strictly on delivering new features.`,
            feedback: `PMI Mindset: Empower the team to manage technical debt. Never mandate overtime.`
        },
        {
            domain: "Hybrid", topic: "Stakeholders", char: "👮", speaker: "Earth Command",
            scenario: `"I am furious. I demand a detailed 12-month Gantt chart for the Agile software modules."`,
            correct: `Educate the stakeholder on Agile, providing a high-level roadmap and detailed short-term sprint plans.`,
            wrong1: `Refuse the request, explaining that Agile does not use Gantt charts.`,
            wrong2: `Force the Agile software team to pause work and estimate tasks for the next 12 months.`,
            feedback: `PMI Mindset: In a Hybrid project, the PM bridges the gap. Educate traditional stakeholders.`
        },
        {
            domain: "Predictive", topic: "Communications", char: "👩‍🔬", speaker: "Scientist",
            scenario: `"I'm angry! I haven't received any of the weekly soil sample progress reports."`,
            correct: `Review the Stakeholder Register and update the Communications Management Plan to include her.`,
            wrong1: `Apologize and immediately email her the latest progress reports.`,
            wrong2: `Tell her she is not authorized to receive reports and escalate to the Sponsor.`,
            feedback: `PMI Mindset: Always investigate and follow the process! Check the Register and update the Plan before acting.`
        },
        {
            domain: "Agile", topic: "Sprint Events", char: "👨‍💼", speaker: "Sponsor",
            scenario: `"The Product Owner is sick today. Let's just cancel the Sprint Review."`,
            correct: `Hold the Sprint Review anyway to demonstrate the working increment to available stakeholders.`,
            wrong1: `Cancel the Sprint Review and wait until the Product Owner returns next week.`,
            wrong2: `Replace the Sprint Review with a Sprint Retrospective to save time.`,
            feedback: `PMI Mindset: Never cancel Sprint events! The purpose of the Review is to inspect and adapt; this can happen without the PO.`
        }
    ];

    let currentIndex = -1;
    let score = 0;

    function loadScenario() {
        if (currentIndex >= database.length) { endGame(); return; }

        const currentData = database[currentIndex];
        
        document.getElementById("hud-progress").innerText = (currentIndex + 1) + " / " + database.length;
        document.getElementById("domain").innerText = currentData.domain + " - " + currentData.topic;
        document.getElementById("speaker").innerText = currentData.speaker;
        document.getElementById("char").innerText = currentData.char;
        document.getElementById("message").innerText = currentData.scenario;
        
        document.getElementById("next-btn").style.display = "none";
        const optionsBox = document.getElementById("options");
        optionsBox.style.display = "flex";
        optionsBox.innerHTML = ""; 

        let choices = [
            { text: currentData.correct, isCorrect: true },
            { text: currentData.wrong1, isCorrect: false },
            { text: currentData.wrong2, isCorrect: false }
        ];
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            let btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = choice.text;
            btn.onclick = () => makeChoice(choice.isCorrect, currentData.feedback);
            optionsBox.appendChild(btn);
        });
    }

    function makeChoice(isCorrect, feedback) {
        document.getElementById("options").style.display = "none";
        if (isCorrect) {
            score += 100;
            document.getElementById("message").innerHTML = "✅ <strong>CORRECT!</strong><br><br>" + feedback;
            document.getElementById("char").innerText = "🎉";
        } else {
            document.getElementById("message").innerHTML = "❌ <strong>INCORRECT!</strong><br><br>" + feedback;
            document.getElementById("char").innerText = "🤦";
        }
        document.getElementById("hud-score").innerText = score;
        document.getElementById("speaker").innerText = "System Feedback";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIndex++;
        loadScenario();
    }
</script>
</body>
</html>
